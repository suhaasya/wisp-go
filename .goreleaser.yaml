version: 2
project_name: wisp

before:
  hooks:
    - make web

builds:
  - id: wisp
    main: ./cmd/wisp
    binary: wisp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "wisp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

signs:
  - cmd: bash
    signature: "${artifact}.minisig"
    env:
      - MINISIGN_KEY_FILE={{ .Env.MINISIGN_KEY_FILE }}
    args:
      - -ceu
      - |
        if [ -z "${MINISIGN_KEY_FILE:-}" ] || [ ! -f "${MINISIGN_KEY_FILE}" ]; then
          echo "MINISIGN_KEY_FILE not set (configure MINISIGN_SECRET_KEY in CI)" >&2
          exit 1
        fi
        minisign -S -s "${MINISIGN_KEY_FILE}" -x "${signature}" -m "${artifact}"
        test -s "${signature}"
    artifacts: checksum

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: suhaasya
    name: wisp-go
  draft: false

brews:
  - name: wisp
    repository:
      owner: suhaasya
      name: homebrew-wisp
    commit_author:
      name: Wisp Release
      email: release@wisp.local
    homepage: https://github.com/suhaasya/wisp-go
    description: Local database client for PostgreSQL, MySQL and MariaDB
    install: |
      bin.install "wisp"
    test: |
      system "#{bin}/wisp", "version"

scoops:
  - name: wisp
    repository:
      owner: suhaasya
      name: scoop-wisp
    homepage: https://github.com/suhaasya/wisp-go
    description: Local database client for PostgreSQL, MySQL and MariaDB
    license: Apache-2.0
    persist: []
