name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install minisign
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz" | tar xzf - -C "$tmp"
          case "$(uname -m)" in
            x86_64) minisign_arch=x86_64 ;;
            aarch64|arm64) minisign_arch=aarch64 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          sudo install -m 0755 "$tmp/minisign-linux/${minisign_arch}/minisign" /usr/local/bin/minisign
          minisign -v

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: Prepare minisign key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "MINISIGN_SECRET_KEY repository secret is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/wisp-minisign.key
          chmod 600 /tmp/wisp-minisign.key
          test -s /tmp/wisp-minisign.key
          minisign -v

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Apple codesign / notarization (skipped when unset)
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_KEY_ISSUER_ID: ${{ secrets.AC_API_KEY_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: goreleaser release --clean

      - name: Check compressed artifact sizes
        run: |
          set -euo pipefail
          max=$((10 * 1024 * 1024))
          for f in dist/wisp_*.tar.gz dist/wisp_*.zip; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f compressed-ish size $size"
            if [ "$size" -gt "$max" ]; then
              echo "artifact exceeds 10 MB cap: $f"
              exit 1
            fi
          done
