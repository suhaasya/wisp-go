name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: npm ci (web)
        run: npm ci --prefix web

      - name: make lint
        run: make lint

      - name: govulncheck
        run: govulncheck ./...

      - name: npm audit (production deps)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: true
          - os: macos-14
            race: false
          - os: windows-2022
            race: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make web
        run: make web

      - name: go test
        run: go test ./...

      - name: go test -race
        if: matrix.race
        run: go test -race ./...

      - name: npm test
        run: npm --prefix web test

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend once
        run: make web

      - name: Cross-compile wisp (CGO_ENABLED=0)
        shell: bash
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p bin
          targets=(
            "darwin arm64 wisp-darwin-arm64"
            "darwin amd64 wisp-darwin-amd64"
            "linux amd64 wisp-linux-amd64"
            "linux arm64 wisp-linux-arm64"
            "windows amd64 wisp-windows-amd64.exe"
          )
          for t in "${targets[@]}"; do
            read -r goos goarch out <<< "$t"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "bin/${out}" ./cmd/wisp
          done
          ls -la bin/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wisp-binaries
          path: |
            bin/wisp-darwin-arm64
            bin/wisp-darwin-amd64
            bin/wisp-linux-amd64
            bin/wisp-linux-arm64
            bin/wisp-windows-amd64.exe
          if-no-files-found: error
