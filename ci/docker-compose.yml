services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wisp
      POSTGRES_PASSWORD: wisp
      POSTGRES_DB: wisp_bench
    ports:
      - "54329:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisp -d wisp_bench"]
      interval: 5s
      timeout: 5s
      retries: 10

