name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/tabbench/package-lock.json
      - name: Docker fixtures
        run: docker compose -f ci/docker-compose.yml up -d --wait
      - name: Size bench gate
        run: make size bench gate
      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'bench-results/gate-comment.md';
            let body = '## Wisp budget gate\n\nGate job completed. See workflow artifacts for `bench-results/`.\n';
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  gate-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make size bench gate
        env:
          WISP_SKIP_TAB: "1"

  gate-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make size bench gate
        env:
          WISP_SKIP_TAB: "1"
